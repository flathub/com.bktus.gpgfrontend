# Opens a pull request for each new stable GpgFrontend release: the manifest
# pinned to the release tag and its commit, and cargo-sources.json made from
# the tag's Cargo.lock (scripts/update-release.sh). Flathub's buildbot then
# test-builds the pull request; merging it publishes the update.
#
# By hand: run it with a version to propose that release instead of the
# latest one, or as a dry run to see the change without pushing anything.

name: Update Release

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Release to propose (X.Y.Z); empty: the latest stable one"
        required: false
        default: ""
      dry_run:
        description: "Show the change only"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: update-release
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: master
          persist-credentials: false

      - name: Install Cargo Generator Dependencies
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install -q aiohttp tomlkit

      # A pull request opened with GITHUB_TOKEN needs the organization to let
      # Actions create pull requests; FLATHUB_PR_TOKEN (a fine-grained token
      # with contents and pull requests write on this repository) stands in
      # where it does not.
      - name: Propose the latest stable release
        env:
          GH_TOKEN: ${{ secrets.FLATHUB_PR_TOKEN || github.token }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          PYTHON="${RUNNER_TEMP}/venv/bin/python" scripts/update-release.sh
